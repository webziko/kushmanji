# Runs on every push and pull request, on Windows (M9-03). It is the only place the Windows-only unit tests run
# when the work is done from a Linux machine (a cloud session), so read its result after pushing from one.
#
# It covers what needs no window and no agent sign-in: every file parses, the unit tests pass, and no dependency
# has a known vulnerability. The end-to-end self-test (`npm run smoke`) and the agent tests stay local, because
# they need a desktop, FFmpeg, Chrome and signed-in agents.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows, because that is the only platform this app is for.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
