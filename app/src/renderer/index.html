<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only this folder's own code runs here, and only Studio's local server may be framed. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src http://127.0.0.1:*"
    />
    <!-- Light only: the colours are our own, so dark mode must not repaint menus or scrollbars. -->
    <meta name="color-scheme" content="light" />
    <title>Kushmanji</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-view="loading">
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
